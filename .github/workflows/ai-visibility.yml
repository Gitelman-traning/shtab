name: AI visibility

# Трекер видимости в ИИ-ответах (collector/ai_visibility.py): раз в неделю, ночь на понедельник.
# 21 вопрос × ChatGPT и Яндекс ≈ 700 ₽ в месяц, потолок на прогон — BUDGET_RUB.

on:
  schedule:
    - cron: '0 22 * * 0'      # вс 22:00 UTC = пн 01:00 МСК
  workflow_dispatch:
    inputs:
      limit:
        description: 'Only first N questions (empty = all)'
        required: false
        default: ''
      dry:
        description: 'Do not write to Shtab (test run)'
        type: boolean
        default: false
      from_run:
        description: 'Record an earlier run (its run id) instead of asking the AI again'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - uses: actions/download-artifact@v4
        if: github.event.inputs.from_run != ''
        with:
          name: ai-visibility
          path: in/
          run-id: ${{ github.event.inputs.from_run }}
          github-token: ${{ github.token }}
      - run: |
          mkdir -p out
          SRC=$(ls in/ai-visibility-*.json 2>/dev/null | head -1)
          python collector/ai_visibility.py --out out ${LIMIT:+--limit $LIMIT} ${DRY:+--dry} ${SRC:+--from $SRC}
        env:
          LIMIT: ${{ github.event.inputs.limit }}
          DRY: ${{ github.event.inputs.dry == 'true' && '1' || '' }}
          PROXYAPI_KEY_TRACKER: ${{ secrets.PROXYAPI_KEY_TRACKER }}
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          BUDGET_RUB: '150'
          SHTAB_URL: ${{ secrets.SHTAB_URL }}
          SHTAB_TOKEN: ${{ secrets.SHTAB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-visibility
          path: out/
          retention-days: 90
