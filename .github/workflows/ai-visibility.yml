name: AI visibility

# Трекер видимости в ИИ-ответах (collector/ai_visibility.py): раз в неделю, ночь на понедельник.
# 21 вопрос × ChatGPT и Яндекс ≈ 700 ₽ в месяц, потолок на прогон — BUDGET_RUB.

on:
  schedule:
    - cron: '0 22 * * 0'      # вс 22:00 UTC = пн 01:00 МСК
  workflow_dispatch:
    inputs:
      limit:
        description: 'Only first N questions (empty = all)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: |
          mkdir -p out
          python collector/ai_visibility.py --out out ${LIMIT:+--limit $LIMIT}
        env:
          LIMIT: ${{ github.event.inputs.limit }}
          PROXYAPI_KEY_TRACKER: ${{ secrets.PROXYAPI_KEY_TRACKER }}
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          BUDGET_RUB: '150'
          SHTAB_URL: ${{ secrets.SHTAB_URL }}
          SHTAB_TOKEN: ${{ secrets.SHTAB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-visibility
          path: out/
          retention-days: 90
