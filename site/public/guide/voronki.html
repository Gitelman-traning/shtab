<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Штаб · Воронки amoCRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--page:#faf8f4;--card:#fff;--soft:#f3f1ec;--line:#f1eee8;--line-2:#e7e3da;--ink:#2b2721;--dim:#7b766f;--faint:#a29d95;--gold:#8a6f3d;--gold-soft:#efe7d6;--gold-b:#b59f76;--ok:#38765a;--bad:#ad4636}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#161718;--card:#1e2021;--soft:#232526;--line:#282a2b;--line-2:#333637;--ink:#eceae5;--dim:#9a958d;--faint:#75716a;--gold:#c9b487;--gold-soft:#2a2721;--ok:#7cc396;--bad:#e58975}}
:root[data-theme="dark"]{--page:#161718;--card:#1e2021;--soft:#232526;--line:#282a2b;--line-2:#333637;--ink:#eceae5;--dim:#9a958d;--faint:#75716a;--gold:#c9b487;--gold-soft:#2a2721;--ok:#7cc396;--bad:#e58975}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,Arial,sans-serif;font-size:14px;line-height:1.5}
a{color:var(--gold)}
.layout{display:flex;min-height:100vh}
.side{width:216px;flex:none;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:16px 12px 14px;overflow:hidden;transition:width .16s ease;position:sticky;top:0;height:100vh}
:root[data-menu="mini"] .side{width:66px}
.side .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 16px;min-width:0}
.mark{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:9px;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:12px}
.side .brand .txt b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap}.side .brand .txt span{display:block;font-size:11.5px;color:var(--faint);white-space:nowrap}
.side nav{display:flex;flex-direction:column;gap:3px}
.side nav .grp{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding:10px 10px 4px;white-space:nowrap}
.side nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;color:var(--dim);text-decoration:none;font-size:13.5px;white-space:nowrap}
.side nav a:hover{background:var(--soft);color:var(--ink)}.side nav a.on{background:var(--gold-soft);color:var(--gold);font-weight:600}
.side nav a svg{flex:none;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.side .grow{flex:1}
.side .collapse{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;background:none;border:0;color:var(--faint);font-family:inherit;font-size:12.5px;cursor:pointer;text-align:left;white-space:nowrap}
.side .collapse svg{flex:none;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;transition:transform .16s ease}
:root[data-menu="mini"] .side .collapse svg{transform:rotate(180deg)}
:root[data-menu="mini"] .side .txt,:root[data-menu="mini"] .side nav a span,:root[data-menu="mini"] .side .collapse span,:root[data-menu="mini"] .side nav .grp{display:none}
:root[data-menu="mini"] .side nav a,:root[data-menu="mini"] .side .collapse{justify-content:center;padding:11px 0}
.pane{flex:1;min-width:0;display:flex;flex-direction:column}
@media (max-width:760px){.side{width:66px}.side .txt,.side nav a span,.side .collapse span,.side nav .grp{display:none}.side nav a,.side .collapse{justify-content:center;padding:11px 0}}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 24px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:15px;font-weight:600}header .sub{margin:0;font-size:12px;color:var(--dim)}header .spacer{flex:1}
main{padding:22px 24px 70px;display:flex;flex-direction:column;gap:18px;max-width:1100px}
.card{background:var(--card);border-radius:16px;padding:18px 20px}
h2{margin:0 0 10px;font-size:14px}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}th{font-weight:500;color:var(--faint);font-size:11.5px}
td.num{text-align:right;font-variant-numeric:tabular-nums}.sub{color:var(--dim);font-size:12.5px}.err{color:var(--bad)}
</style>
<style>
main.map{padding:0;max-width:none;flex:1;display:block}
main.map iframe{display:block;width:100%;height:calc(100vh - 66px);border:0;background:#f6f4ef}
.pane header .sub a{color:var(--gold)}
</style>
</head>
<body>
<div class="layout">
<aside class="side" id="side"></aside>
<div class="pane">
<header><div><h1>Справка · Воронки amoCRM</h1><p class="sub">как живёт сделка: пять воронок, кто и почему переносит, что запрещено · <a href="/guide/voronki-map" target="_blank" rel="noopener">открыть схему отдельно</a> · для менеджеров без пароля: <a href="https://journal.gitelman.team/amo/voronki" target="_blank" rel="noopener">journal.gitelman.team/amo/voronki</a></p></div><div class="spacer"></div></header>
<main class="map"><iframe src="/guide/voronki-map" title="Карта воронок amoCRM" loading="eager"></iframe></main>
</div>
</div>
<script src="/nav.js"></script>
</body>
</html>
