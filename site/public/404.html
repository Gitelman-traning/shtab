<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Штаб · Страницы нет</title>
<style>
:root{--page:#faf8f4;--card:#fff;--ink:#2b2721;--dim:#7b766f;--gold:#8a6f3d;--gold-soft:#efe7d6}
@media (prefers-color-scheme: dark){:root{--page:#161718;--card:#1e2021;--ink:#eceae5;--dim:#9a958d;--gold:#c9b487;--gold-soft:#2a2721}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--page);color:var(--ink);font-family:Inter,Arial,sans-serif}
.box{background:var(--card);border-radius:16px;padding:28px 32px;max-width:420px;display:flex;flex-direction:column;gap:10px}
.mark{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:12px}
h1{margin:0;font-size:16px}p{margin:0;color:var(--dim);font-size:13.5px}a{color:var(--gold)}
</style>
</head>
<body>
<div class="box"><div class="mark">12</div><h1>Такой страницы нет</h1>
<p>Адрес устарел или набран с ошибкой.</p>
<p><a href="/">Общий экран Штаба</a> · <a href="/sales/l2/meetings">Встречи ОКК</a></p></div>
</body>
</html>
