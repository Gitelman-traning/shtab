<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<title>Проверка связи с АТС</title>
<!-- Скрытая страница Штаба (не в меню, открыта без входа): сотрудник проверяет своё подключение к АТС onlinePBX.
     Код и стили проверки — /pbx-check.js и /pbx-check.css (их же берёт /sales/l1/svyaz/). Журнал — Настройки → «Журнал проверок АТС» (/settings/pbx-log/). 23.10.2026 -->
<style>
:root{
  --page:#faf8f4; --card:#ffffff; --soft:#f3f1ec; --line:#f1eee8; --line-2:#e7e3da;
  --ink:#2b2721; --dim:#7b766f; --faint:#a29d95; --gold:#8a6f3d; --gold-soft:#efe7d6; --gold-b:#b59f76;
  --ok:#38765a; --ok-bg:#e8f2ec; --mid:#8d6a17; --mid-bg:#fbf1de; --bad:#ad4636; --bad-bg:#fbe9e6; --ok-bar:#6aa87f;
}
@media (prefers-color-scheme: dark){
  :root{
    --page:#161718; --card:#1e2021; --soft:#232526; --line:#282a2b; --line-2:#333637;
    --ink:#eceae5; --dim:#9a958d; --faint:#75716a; --gold:#c9b487; --gold-soft:#2a2721; --gold-b:#b59f76;
    --ok:#7cc396; --ok-bg:#1b2b23; --mid:#dcb463; --mid-bg:#2c2617; --bad:#e58975; --bad-bg:#2f1e1a;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:860px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:20px;margin:0 0 4px} h2{font-size:15px;margin:28px 0 10px}
.sub{color:var(--dim);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line-2);border-radius:14px;padding:16px}
</style>
<link rel="stylesheet" href="/pbx-check.css">
</head>
<body>
<main class="pbx">
  <h1>Проверка связи с АТС</h1>
  <p class="sub">Страница проверит, может ли ваш браузер работать с телефонией: интернет, сервер АТС, голосовое соединение, микрофон. Займёт около 20 секунд. Перед проверкой закройте вкладку с телефоном, если микрофон занят.</p>

  <div class="card">
    <div class="row">
      <input type="text" id="name" placeholder="Ваше имя и фамилия" maxlength="80" autocomplete="name" aria-label="Имя">
      <button class="main" id="go">Проверить соединение с АТС</button>
    </div>
    <div class="verdict" id="verdict"></div>
    <ul class="steps" id="steps"></ul>
    <div class="row tools" id="tools">
      <button id="beep">Проверить динамики</button>
      <button id="copy">Скопировать отчёт</button>
      <span class="muted" id="copied"></span>
    </div>
  </div>

</main>

<script src="/pbx-check.js"></script>
</body>
</html>
