# Справочная копия. Файл wrangler.toml из репозитория убран намеренно: при его наличии сборка Cloudflare Pages берёт переменные
# только из него и не видит переменные панели (ключ сервис-аккаунта в файл класть нельзя). Привязки D1/KV и переменные — в панели Pages.
# Для локальных команд wrangler: npx wrangler -c wrangler.reference.toml …
name = "okk-dashboard"
pages_build_output_dir = "public"
compatibility_date = "2026-08-01"

# Общий пароль страниц (задаётся при первом входе, хранится в KV)
[[kv_namespaces]]
binding = "OKK_KV"
id = "7d847d9c74434c35a28b148f488dd3b0"

# Витрина показателей Штаба
[[d1_databases]]
binding = "DB"
database_name = "shtab"
database_id = "d0671a0c-e19a-44f6-ac76-39f8c79b499c"

# несекретные переменные сборки и рантайма (секреты — только в панели Pages)
[vars]
SHEET_ID = "1gbj-FGKRnc5Cm4s5_qFfHpx-gHqL3Bn37FQbR8gTpuY"
PYTHON_VERSION = "3.12"
ASK_MODEL = "anthropic/claude-sonnet-5"
EDIT_MODEL = "anthropic/claude-sonnet-5"
